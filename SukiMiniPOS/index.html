<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Suki Mini POS</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202925;
      --muted: #69756f;
      --line: #e7ece9;
      --surface: #ffffff;
      --soft: #f5f8f6;
      --green: #26734f;
      --green-dark: #1d5d3f;
      --green-soft: #eaf4ee;
      --danger: #a13e37;
      --shadow: 0 14px 40px rgba(28, 53, 40, 0.07);
      font-family: "Leelawadee UI", Tahoma, "Noto Sans Thai", system-ui, sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.55;
    }

    button { font: inherit; }

    .page {
      width: min(1120px, 100% - 40px);
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-mark {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 15px;
      background: var(--green-soft);
      font-size: 24px;
    }

    .brand-name { margin: 0; font-size: 17px; font-weight: 750; letter-spacing: -0.02em; }
    .brand-note { margin: 1px 0 0; color: var(--muted); font-size: 13px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #4c5a52;
      background: var(--surface);
      font-size: 13px;
      white-space: nowrap;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #47a66e; }

    .intro { margin-bottom: 26px; }
    .intro h1 { margin: 0; font-size: clamp(27px, 4vw, 34px); line-height: 1.25; letter-spacing: -0.035em; }
    .intro p { margin: 8px 0 0; color: var(--muted); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(330px, 0.9fr);
      align-items: start;
      gap: 24px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .menu-panel { padding: 25px; }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .section-heading h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
    .section-heading p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .menu-count { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .product-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

    .product-card {
      display: flex;
      min-width: 0;
      min-height: 220px;
      flex-direction: column;
      padding: 18px 16px 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fff;
      transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .product-card:hover { transform: translateY(-2px); border-color: #bfd8c9; box-shadow: 0 9px 22px rgba(28, 53, 40, 0.07); }
    .product-emoji { display: grid; width: 50px; height: 50px; place-items: center; border-radius: 15px; background: var(--soft); font-size: 27px; }
    .product-info { flex: 1; padding-top: 15px; }
    .product-name { margin: 0; font-size: 16px; font-weight: 700; }
    .product-description { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .product-price { margin: 10px 0 13px; font-size: 18px; font-weight: 750; letter-spacing: -0.02em; }

    .add-button {
      display: inline-flex;
      width: 100%;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid #c9dfd1;
      border-radius: 12px;
      color: var(--green-dark);
      background: var(--green-soft);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background 150ms ease, border-color 150ms ease, transform 100ms ease;
    }

    .add-button:hover { border-color: var(--green); background: #dceee3; }
    .add-button:active { transform: scale(0.98); }
    .add-button:focus-visible, .quantity-button:focus-visible, .clear-button:focus-visible { outline: 3px solid #8ac5a2; outline-offset: 2px; }
    .add-icon { font-size: 18px; line-height: 1; }

    .cart-panel { position: sticky; top: 20px; overflow: hidden; }
    .cart-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 23px 23px 18px; border-bottom: 1px solid var(--line); }
    .cart-title-wrap { display: flex; align-items: center; gap: 11px; }
    .cart-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: var(--green-soft); font-size: 20px; }
    .cart-header h2 { margin: 0; font-size: 19px; }
    .cart-subtitle { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .item-badge { display: inline-flex; min-width: 29px; height: 29px; align-items: center; justify-content: center; padding: 0 8px; border-radius: 999px; color: var(--green-dark); background: var(--green-soft); font-size: 13px; font-weight: 750; }

    .cart-content { min-height: 188px; padding: 4px 23px 0; }
    .empty-cart { display: grid; min-height: 184px; align-content: center; justify-items: center; padding: 15px; text-align: center; }
    .empty-icon { display: grid; width: 55px; height: 55px; place-items: center; margin-bottom: 12px; border-radius: 18px; background: var(--soft); font-size: 26px; }
    .empty-cart strong { font-size: 15px; }
    .empty-cart p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .cart-items { list-style: none; margin: 0; padding: 0; }
    .cart-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .cart-item:first-child { padding-top: 18px; }
    .cart-item-main { display: flex; min-width: 0; align-items: center; gap: 11px; }
    .cart-item-emoji { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border-radius: 13px; background: var(--soft); font-size: 21px; }
    .cart-item-name { overflow: hidden; margin: 0; font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .cart-item-unit { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .cart-item-total { align-self: start; padding-top: 2px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .quantity-controls { display: flex; align-items: center; gap: 9px; margin-top: 8px; }
    .quantity-button { display: grid; width: 30px; height: 30px; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fff; cursor: pointer; font-size: 17px; line-height: 1; }
    .quantity-button:hover { border-color: #b9cfc1; background: var(--soft); }
    .quantity-value { min-width: 15px; text-align: center; font-size: 13px; font-weight: 700; }

    .cart-footer { padding: 18px 23px 23px; border-top: 1px solid var(--line); background: #fcfdfc; }
    .total-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .total-label { color: #4c5a52; font-size: 14px; font-weight: 650; }
    .total-value { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; }
    .total-currency { margin-left: 4px; font-size: 14px; font-weight: 600; letter-spacing: 0; }
    .clear-button { width: 100%; min-height: 44px; margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--danger); background: #fff; cursor: pointer; font-size: 14px; font-weight: 700; transition: background 150ms ease, border-color 150ms ease; }
    .clear-button:hover:not(:disabled) { border-color: #e7c4c0; background: #fff8f7; }
    .clear-button:disabled { color: #a6afaa; background: #f7f9f7; cursor: not-allowed; }

    .page-footer { margin-top: 22px; color: #87918b; font-size: 12px; text-align: center; }

    @media (max-width: 850px) {
      .workspace { grid-template-columns: minmax(0, 1fr) minmax(290px, 0.85fr); gap: 16px; }
      .menu-panel { padding: 21px; }
      .product-list { grid-template-columns: 1fr; }
      .product-card { min-height: auto; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px; }
      .product-emoji { width: 48px; height: 48px; }
      .product-info { padding-top: 0; }
      .product-description { display: none; }
      .product-price { margin: 3px 0 0; font-size: 16px; }
      .add-button { width: 44px; min-height: 44px; font-size: 0; }
      .add-icon { font-size: 21px; }
    }

    @media (max-width: 680px) {
      .page { width: min(100% - 28px, 520px); padding: 20px 0 32px; }
      .topbar { margin-bottom: 25px; }
      .brand-mark { width: 42px; height: 42px; }
      .status { padding: 7px 10px; font-size: 12px; }
      .intro { margin-bottom: 20px; }
      .intro p { font-size: 14px; }
      .workspace { grid-template-columns: 1fr; gap: 15px; }
      .menu-panel { padding: 19px 16px; }
      .section-heading { margin-bottom: 15px; }
      .section-heading h2 { font-size: 18px; }
      .product-list { gap: 10px; }
      .product-card { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 11px; padding: 12px; }
      .product-emoji { width: 46px; height: 46px; font-size: 24px; }
      .cart-panel { position: static; }
      .cart-header { padding: 18px 17px 15px; }
      .cart-content { padding-right: 17px; padding-left: 17px; }
      .cart-footer { padding: 16px 17px 18px; }
      .page-footer { margin-top: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="Suki Mini POS">
        <span class="brand-mark" aria-hidden="true">🍲</span>
        <div>
          <p class="brand-name">Suki Mini POS</p>
          <p class="brand-note">ระบบขายหน้าร้าน</p>
        </div>
      </div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span>พร้อมรับออเดอร์</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">คิดเงินออเดอร์</h1>
        <p>เลือกเมนูที่ลูกค้าต้องการ แล้วตรวจสอบยอดรวมในตะกร้า</p>
      </section>

      <div class="workspace">
        <section class="panel menu-panel" aria-labelledby="menu-title">
          <div class="section-heading">
            <div>
              <h2 id="menu-title">เมนูอาหาร</h2>
              <p>แตะปุ่มเพื่อเพิ่มรายการลงในตะกร้า</p>
            </div>
            <span class="menu-count">3 รายการ</span>
          </div>
          <div class="product-list" id="product-list" aria-label="รายการเมนู"></div>
        </section>

        <aside class="panel cart-panel" aria-labelledby="cart-title" aria-live="polite">
          <div class="cart-header">
            <div class="cart-title-wrap">
              <span class="cart-icon" aria-hidden="true">🧺</span>
              <div>
                <h2 id="cart-title">ตะกร้าสินค้า</h2>
                <p class="cart-subtitle">รายการสำหรับออเดอร์นี้</p>
              </div>
            </div>
            <span class="item-badge" id="item-count" aria-label="จำนวนชิ้นในตะกร้า">0</span>
          </div>
          <div class="cart-content" id="cart-content"></div>
          <footer class="cart-footer">
            <div class="total-row" aria-live="polite">
              <span class="total-label">ยอดรวม</span>
              <span class="total-value"><span id="total-value">0</span><span class="total-currency">บาท</span></span>
            </div>
            <button class="clear-button" id="clear-cart" type="button" disabled>ล้างตะกร้า</button>
          </footer>
        </aside>
      </div>
    </main>

    <footer class="page-footer">Suki Mini POS · ใช้งานได้ทันทีในเบราว์เซอร์</footer>
  </div>

  <script>
    "use strict";

    const products = [
      { id: "pork", name: "ชุดหมู", price: 199, emoji: "🐷", description: "ชุดหมูสไลซ์พร้อมทาน" },
      { id: "beef", name: "ชุดเนื้อ", price: 249, emoji: "🥩", description: "ชุดเนื้อสไลซ์พร้อมทาน" },
      { id: "water", name: "น้ำดื่ม", price: 20, emoji: "💧", description: "น้ำดื่มเย็น 1 ขวด" }
    ];

    const cart = new Map();
    const numberFormat = new Intl.NumberFormat("th-TH", { maximumFractionDigits: 0 });
    const productList = document.getElementById("product-list");
    const cartContent = document.getElementById("cart-content");
    const totalValue = document.getElementById("total-value");
    const itemCount = document.getElementById("item-count");
    const clearButton = document.getElementById("clear-cart");

    function formatBaht(amount) {
      return numberFormat.format(amount) + " บาท";
    }

    function renderProducts() {
      productList.replaceChildren();

      for (const product of products) {
        const card = document.createElement("article");
        card.className = "product-card";

        const emoji = document.createElement("span");
        emoji.className = "product-emoji";
        emoji.setAttribute("aria-hidden", "true");
        emoji.textContent = product.emoji;

        const info = document.createElement("div");
        info.className = "product-info";
        const name = document.createElement("h3");
        name.className = "product-name";
        name.textContent = product.name;
        const description = document.createElement("p");
        description.className = "product-description";
        description.textContent = product.description;
        const price = document.createElement("p");
        price.className = "product-price";
        price.textContent = formatBaht(product.price);
        info.append(name, description, price);

        const addButton = document.createElement("button");
        addButton.type = "button";
        addButton.className = "add-button";
        addButton.setAttribute("aria-label", "เพิ่ม" + product.name + "ลงตะกร้า");
        const addIcon = document.createElement("span");
        addIcon.className = "add-icon";
        addIcon.setAttribute("aria-hidden", "true");
        addIcon.textContent = "+";
        addButton.append(addIcon, document.createTextNode("เพิ่มลงตะกร้า"));
        addButton.addEventListener("click", () => changeQuantity(product.id, 1));

        card.append(emoji, info, addButton);
        productList.append(card);
      }
    }

    function changeQuantity(productId, amount) {
      const current = cart.get(productId) || 0;
      const next = current + amount;

      if (next <= 0) {
        cart.delete(productId);
      } else {
        cart.set(productId, next);
      }

      renderCart();
    }

    function renderCart() {
      cartContent.replaceChildren();
      const entries = products.filter((product) => cart.has(product.id));
      const totalItems = entries.reduce((sum, product) => sum + cart.get(product.id), 0);
      const total = entries.reduce((sum, product) => sum + product.price * cart.get(product.id), 0);

      itemCount.textContent = numberFormat.format(totalItems);
      itemCount.setAttribute("aria-label", "จำนวน " + totalItems + " ชิ้นในตะกร้า");
      totalValue.textContent = numberFormat.format(total);
      clearButton.disabled = totalItems === 0;

      if (entries.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-cart";
        const icon = document.createElement("span");
        icon.className = "empty-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "🛒";
        const heading = document.createElement("strong");
        heading.textContent = "ยังไม่มีสินค้าในตะกร้า";
        const message = document.createElement("p");
        message.textContent = "เลือกเมนูเพื่อเริ่มรายการใหม่";
        empty.append(icon, heading, message);
        cartContent.append(empty);
        return;
      }

      const list = document.createElement("ul");
      list.className = "cart-items";

      for (const product of entries) {
        const quantity = cart.get(product.id);
        const item = document.createElement("li");
        item.className = "cart-item";

        const main = document.createElement("div");
        main.className = "cart-item-main";
        const emoji = document.createElement("span");
        emoji.className = "cart-item-emoji";
        emoji.setAttribute("aria-hidden", "true");
        emoji.textContent = product.emoji;

        const detail = document.createElement("div");
        detail.style.minWidth = "0";
        const name = document.createElement("p");
        name.className = "cart-item-name";
        name.textContent = product.name;
        const unit = document.createElement("p");
        unit.className = "cart-item-unit";
        unit.textContent = formatBaht(product.price) + " / ชิ้น";

        const controls = document.createElement("div");
        controls.className = "quantity-controls";
        const decrease = document.createElement("button");
        decrease.type = "button";
        decrease.className = "quantity-button";
        decrease.setAttribute("aria-label", "ลดจำนวน" + product.name);
        decrease.textContent = "−";
        decrease.addEventListener("click", () => changeQuantity(product.id, -1));
        const quantityText = document.createElement("span");
        quantityText.className = "quantity-value";
        quantityText.setAttribute("aria-label", "จำนวน " + quantity + " ชิ้น");
        quantityText.textContent = numberFormat.format(quantity);
        const increase = document.createElement("button");
        increase.type = "button";
        increase.className = "quantity-button";
        increase.setAttribute("aria-label", "เพิ่มจำนวน" + product.name);
        increase.textContent = "+";
        increase.addEventListener("click", () => changeQuantity(product.id, 1));
        controls.append(decrease, quantityText, increase);
        detail.append(name, unit, controls);
        main.append(emoji, detail);

        const lineTotal = document.createElement("span");
        lineTotal.className = "cart-item-total";
        lineTotal.textContent = formatBaht(product.price * quantity);
        item.append(main, lineTotal);
        list.append(item);
      }

      cartContent.append(list);
    }

    clearButton.addEventListener("click", () => {
      cart.clear();
      renderCart();
    });

    renderProducts();
    renderCart();
  </script>
</body>
</html>
